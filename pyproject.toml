[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-log-triage"
version = "0.1.0"
description = "Offline educational triage of user-provided Linux text logs"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
linux-log-triage = "linux_log_triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
